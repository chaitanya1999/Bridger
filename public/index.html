<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridger</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fa;
        color: #17202a;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .panel {
        border: 1px solid #d8dee7;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #d8dee7;
        font-size: 1rem;
      }

      form,
      .response {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      .row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #566474;
        font-size: 0.86rem;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cfd7e3;
        border-radius: 6px;
        padding: 10px;
        color: #17202a;
        font: inherit;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
        font-family: Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.45;
      }

      button {
        width: max-content;
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #126e82;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .meta div {
        border: 1px solid #d8dee7;
        border-radius: 6px;
        padding: 10px;
      }

      .meta span {
        display: block;
        color: #566474;
        font-size: 0.78rem;
        font-weight: 700;
      }

      pre {
        min-height: 350px;
        margin: 0;
        border: 1px solid #d8dee7;
        border-radius: 6px;
        padding: 12px;
        background: #fbfcfd;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .error {
        color: #b42318;
      }

      @media (max-width: 850px) {
        .grid,
        .row,
        .meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bridger</h1>

      <div class="grid">
        <section class="panel">
          <h2>Request</h2>
          <form id="form">
            <div class="row">
              <label>
                Method
                <select id="method">
                  <option>GET</option>
                  <option selected>POST</option>
                  <option>PUT</option>
                  <option>PATCH</option>
                  <option>DELETE</option>
                  <option>HEAD</option>
                  <option>OPTIONS</option>
                </select>
              </label>

              <label>
                Endpoint
                <input id="endpoint" type="url" required value="https://httpbin.org/anything" />
              </label>
            </div>

            <label>
              Headers JSON
              <textarea id="headers">{
  "content-type": "application/json"
}</textarea>
            </label>

            <label>
              Body JSON or text
              <textarea id="body">{
  "hello": "world"
}</textarea>
            </label>

            <button id="send" type="submit">Send</button>
          </form>
        </section>

        <section class="panel">
          <h2>Response</h2>
          <div class="response">
            <div class="meta">
              <div>
                <span>Status</span>
                <strong id="status">-</strong>
              </div>
              <div>
                <span>Time</span>
                <strong id="time">-</strong>
              </div>
              <div>
                <span>Size</span>
                <strong id="size">-</strong>
              </div>
            </div>
            <pre id="output">No response yet.</pre>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.querySelector('#form');
      const sendButton = document.querySelector('#send');
      const output = document.querySelector('#output');
      const statusEl = document.querySelector('#status');
      const timeEl = document.querySelector('#time');
      const sizeEl = document.querySelector('#size');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        output.classList.remove('error');
        sendButton.disabled = true;
        sendButton.textContent = 'Sending';

        try {
          const payload = buildPayload();
          const startedAt = performance.now();
          const response = await fetch('/bridge', {
            method: 'POST',
            headers: {
              'content-type': 'application/json'
            },
            body: JSON.stringify(payload)
          });
          const elapsed = Math.round(performance.now() - startedAt);
          const buffer = await response.arrayBuffer();
          const text = new TextDecoder().decode(buffer);

          statusEl.textContent = `${response.status} ${response.statusText}`.trim();
          timeEl.textContent = `${elapsed} ms`;
          sizeEl.textContent = `${buffer.byteLength} B`;
          output.textContent = formatBody(text, response.headers.get('content-type') || '');
        } catch (error) {
          statusEl.textContent = 'Failed';
          timeEl.textContent = '-';
          sizeEl.textContent = '-';
          output.classList.add('error');
          output.textContent = error.message;
        } finally {
          sendButton.disabled = false;
          sendButton.textContent = 'Send';
        }
      });

      function buildPayload() {
        const rawBody = document.querySelector('#body').value.trim();
        const payload = {
          endpoint: document.querySelector('#endpoint').value.trim(),
          method: document.querySelector('#method').value,
          headers: parseJson(document.querySelector('#headers').value || '{}', 'Headers')
        };

        if (rawBody) {
          payload.body = parseBody(rawBody);
        }

        return payload;
      }

      function parseJson(value, label) {
        try {
          return JSON.parse(value);
        } catch (error) {
          throw new Error(`${label} JSON is invalid: ${error.message}`);
        }
      }

      function parseBody(value) {
        try {
          return JSON.parse(value);
        } catch {
          return value;
        }
      }

      function formatBody(text, contentType) {
        if (contentType.includes('application/json')) {
          try {
            return JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            return text;
          }
        }

        return text;
      }
    </script>
  </body>
</html>
